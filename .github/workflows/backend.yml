name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

# um deploy por vez; um push novo nao derruba o que esta publicando
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e

  # so na main, so depois dos testes; a chave de deploy so publica no Lightsail
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SERVICE: ${{ vars.LIGHTSAIL_SERVICE || 'escoramento-api' }}
    steps:
      - uses: actions/checkout@v4
      # falha cedo e diz o nome do que falta (nunca o valor)
      - name: Confere secrets e variables
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
        run: |
          missing=""
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY MONGODB_URI JWT_SECRET \
                      ADMIN_PASSWORD_HASH S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY \
                      AWS_REGION S3_BUCKET ADMIN_EMAIL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Faltando em Settings > Secrets and variables > Actions:$missing"
            exit 1
          fi
          # erros comuns ao colar: ARN ou nome do usuario no lugar da chave, aspas, espaco
          if [[ ! "$AWS_ACCESS_KEY_ID" =~ ^(AKIA|ASIA)[A-Z0-9]{16}$ ]]; then
            echo "::error::AWS_ACCESS_KEY_ID invalido: cole o Access key ID (20 caracteres, comeca com AKIA), sem espacos"
            exit 1
          fi
          if [[ ! "$AWS_SECRET_ACCESS_KEY" =~ ^[A-Za-z0-9/+=]{40}$ ]]; then
            echo "::error::AWS_SECRET_ACCESS_KEY invalido: cole o Secret access key (40 caracteres), sem espacos"
            exit 1
          fi
          echo "tudo configurado; servico: $SERVICE"
      # chave do usuario IAM de deploy (so as acoes de backend/deploy/lightsail-deploy-policy.json)
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Instala o lightsailctl (plugin do push de imagem)
        run: |
          sudo curl -fsSL https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl \
            -o /usr/local/bin/lightsailctl
          sudo chmod +x /usr/local/bin/lightsailctl
      - name: Monta e envia a imagem
        id: image
        run: |
          docker build -t "escoramento-api:${GITHUB_SHA}" .
          out=$(aws lightsail push-container-image --service-name "$SERVICE" \
            --label api --image "escoramento-api:${GITHUB_SHA}")
          echo "$out"
          # a saida termina com: Refer to this image as ":<servico>.api.<n>" in deployments.
          echo "ref=$(echo "$out" | grep -oE ':[A-Za-z0-9-]+\.api\.[0-9]+' | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Publica
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://escoramento-rental-system.vercel.app' }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_REGION: ${{ vars.AWS_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        # jq --arg: os "$" do hash bcrypt e os "&" da URI do Mongo entram literais
        run: |
          test -n "$IMAGE" || { echo "imagem nao identificada no push"; exit 1; }
          jq -n \
            --arg image "$IMAGE" --arg frontend "$FRONTEND_URL" --arg mongo "$MONGODB_URI" \
            --arg jwt "$JWT_SECRET" --arg email "$ADMIN_EMAIL" --arg hash "$ADMIN_PASSWORD_HASH" \
            --arg bucket "$S3_BUCKET" --arg region "$S3_REGION" \
            --arg key "$S3_ACCESS_KEY_ID" --arg secret "$S3_SECRET_ACCESS_KEY" \
            '{api: {image: $image, ports: {"3001": "HTTP"}, environment: {
              PORT: "3001", FRONTEND_URL: $frontend, MONGODB_URI: $mongo,
              JWT_SECRET: $jwt, ADMIN_EMAIL: $email, ADMIN_PASSWORD_HASH: $hash,
              S3_BUCKET: $bucket, S3_REGION: $region, S3_FORCE_PATH_STYLE: "false",
              S3_ACCESS_KEY_ID: $key, S3_SECRET_ACCESS_KEY: $secret,
              STORAGE_QUOTA_MB: "200", TRUST_PROXY_HOPS: "1"}}}' > "$RUNNER_TEMP/containers.json"
          jq -n '{containerName: "api", containerPort: 3001, healthCheck: {
            path: "/api/health", intervalSeconds: 10, timeoutSeconds: 5,
            healthyThreshold: 2, unhealthyThreshold: 3, successCodes: "200"}}' > "$RUNNER_TEMP/endpoint.json"
          aws lightsail create-container-service-deployment --service-name "$SERVICE" \
            --containers "file://$RUNNER_TEMP/containers.json" \
            --public-endpoint "file://$RUNNER_TEMP/endpoint.json" > /dev/null
          rm "$RUNNER_TEMP/containers.json"
      - name: Espera a nova versao ficar ativa
        run: |
          for i in $(seq 1 60); do
            state=$(aws lightsail get-container-service-deployments --service-name "$SERVICE" \
              --query 'deployments[0].state' --output text)
            echo "deployment: $state"
            [ "$state" = "ACTIVE" ] && break
            [ "$state" = "FAILED" ] && { echo "falhou: veja os logs do container no console do Lightsail"; exit 1; }
            sleep 15
          done
          [ "$state" = "ACTIVE" ] || { echo "tempo esgotado"; exit 1; }
          url=$(aws lightsail get-container-services --service-name "$SERVICE" \
            --query 'containerServices[0].url' --output text)
          echo "API: ${url}api"
          curl -fsS "${url}api/health"
