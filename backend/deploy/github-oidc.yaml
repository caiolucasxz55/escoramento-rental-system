AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Papel que o GitHub Actions assume por OIDC para publicar a API no Lightsail
  Container Service. Roda uma vez, a mao (ver README, secao Deploy). Nenhuma chave
  de deploy fica no GitHub.

Parameters:
  GitHubRepo:
    Type: String
    Default: caiolucasxz55/escoramento-rental-system
  Branch:
    Type: String
    Default: main
  CreateOidcProvider:
    Description: false se a conta ja tem o provedor token.actions.githubusercontent.com
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"

Conditions:
  ShouldCreateProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: escoramento-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateProvider
                - !Ref GitHubOidcProvider
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # so workflows deste repositorio, na branch de deploy (PR e fork nao assumem)
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:ref:refs/heads/${Branch}
      Policies:
        - PolicyName: lightsail-deploy-escoramento-api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # o ARN do servico no Lightsail tem um id gerado, nao o nome: o recorte e pelas acoes.
              # so publicar imagem e deployment; criar, apagar ou mudar o plano do servico fica de fora
              - Sid: PublicarNoContainerService
                Effect: Allow
                Action:
                  - lightsail:CreateContainerServiceRegistryLogin
                  - lightsail:RegisterContainerImage
                  - lightsail:CreateContainerServiceDeployment
                  - lightsail:GetContainerServices
                  - lightsail:GetContainerServiceDeployments
                  - lightsail:GetContainerImages
                Resource: "*"

Outputs:
  DeployRoleArn:
    Description: Vai no secret AWS_DEPLOY_ROLE_ARN do repositorio
    Value: !GetAtt DeployRole.Arn
