# Infraestrutura local: MongoDB + MinIO (S3 compativel).
# Backend e frontend rodam com `npm` para manter hot reload.
#
#   docker compose up -d
#
# As credenciais minioadmin sao o padrao local do MinIO, nao segredos reais.
#
# Imagem do MinIO: a MinIO deixou de publicar `minio/minio` e `minio/mc` no
# Docker Hub. A da Chainguard e o mesmo servidor, mantida e publica, e ja traz
# o `mc` -- por isso ela serve tanto ao servidor quanto ao `minio-init`.
name: escoramento

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

services:
  mongo:
    image: mongo:7.0
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      <<: *minio-env
      # Alias usado so pelo healthcheck abaixo.
      MC_HOST_local: http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin}@localhost:9000
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Cria o bucket e garante que ele nao tenha acesso anonimo. Roda e sai.
  minio-init:
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      <<: *minio-env
      S3_BUCKET: ${S3_BUCKET:-escoramento-docs}
    entrypoint: ["sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        mc anonymous set none "local/$$S3_BUCKET"

volumes:
  mongo_data:
  minio_data:
