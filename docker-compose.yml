# Infra local (Mongo + MinIO). Apps: npm (dev, com hot reload) ou
# `docker compose --profile app up -d --build` (API e frontend em container).
# minio/minio saiu do Docker Hub: imagem Chainguard (ja traz o mc).
name: escoramento

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

services:
  mongo:
    image: mongo:7.0
    # cache padrao e ~metade da RAM; 256 MB sobra para o volume do projeto
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      <<: *minio-env
      # alias do healthcheck
      MC_HOST_local: http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin}@localhost:9000
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # cria o bucket privado e sai
  minio-init:
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      <<: *minio-env
      S3_BUCKET: ${S3_BUCKET:-escoramento-docs}
    entrypoint: ["sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        mc anonymous set none "local/$$S3_BUCKET"

  api:
    profiles: [app]
    build: ./backend
    # do .env vem so o que e da pessoa (JWT_SECRET, admin, cota); a infra e a do compose
    # raw: sem isso o compose trata os "$" do hash bcrypt como variaveis
    env_file:
      - path: ./backend/.env
        format: raw
    environment:
      PORT: "3001"
      FRONTEND_URL: http://localhost:3000
      MONGODB_URI: mongodb://mongo:27017/escoramento
      S3_BUCKET: ${S3_BUCKET:-escoramento-docs}
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      # o navegador nao resolve "minio": a URL assinada usa o host publico
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["3001:3001"]
    depends_on:
      mongo:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    profiles: [app]
    build:
      context: ./frontend
      # NEXT_PUBLIC_* vai para o bundle no build; a senha de demo tem de bater com o hash do backend/.env
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api
        NEXT_PUBLIC_DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@escoramento.local}
        NEXT_PUBLIC_DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-admin123}
    ports: ["3000:3000"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo_data:
  minio_data:
